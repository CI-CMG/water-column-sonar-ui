# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Deploy PROD to echo.fish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The tagged version to release."
        required: true

jobs:
  build:
    name: Build Echofish UI for PROD

    runs-on: ubuntu-latest

    environment: prod

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          package-manager-cache: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - run: npm ci
        env:
          VITE_MAPTILER_API: ${{ secrets.VITE_MAPTILER_API }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - run: npm run build
        env:
          VITE_MAPTILER_API: ${{ secrets.VITE_MAPTILER_API }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - run: aws s3 cp --recursive ./dist/ s3://echo.fish/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - run: aws cloudfront create-invalidation --distribution-id E3NV8I4HB1BPJV --paths '/*'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
