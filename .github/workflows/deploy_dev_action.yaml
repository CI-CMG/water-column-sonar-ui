# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Deploy DEV to dev.echo.fish

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Echofish UI for DEV

    runs-on: ubuntu-latest

    environment: dev

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          package-manager-cache: false

      - run: npm ci
        env:
          VITE_MAPTILER_API: ${{ secrets.VITE_MAPTILER_API }}

      - run: npm run build
        env:
          VITE_MAPTILER_API: ${{ secrets.VITE_MAPTILER_API }}

      - run: aws s3 cp --recursive ./dist/ s3://dev.echo.fish/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - run: aws cloudfront create-invalidation --distribution-id E12J3QSUNNLMAN --paths '/*'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

